name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-check:
    name: Mobile Checks (Expo / React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

  admin-check:
    name: Admin Checks (Next.js Dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

  database-security:
    name: Database Security & Authorization Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Supabase CLI (supabase-action)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local services
        run: |
          supabase start
          supabase db reset

      - name: Install dependencies
        run: npm ci

      - name: Run Database Security Integration Suite
        run: npm run test:db
        env:
          CI: 'true'
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long

  migration12-pg-matrix:
    name: Migration 12 PostgreSQL ${{ matrix.pg_version }} Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: ['15', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg_version }}-alpine
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54325:5432
        options: >-
          --health-cmd="pg_isready -U supabase_admin -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Migration 12 Reproducible Integration Suite (PostgreSQL ${{ matrix.pg_version }})
        run: npm run test:m12:integration
        env:
          CI: 'true'
          EXPECTED_PG_MAJOR: ${{ matrix.pg_version }}
          M12_TEST_DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:54325/postgres
          PGPASSWORD: postgres

